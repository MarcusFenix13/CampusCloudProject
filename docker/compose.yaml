name: campuscloud
services:
  #Base de datos PostgreSQL
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - campuscloud-net
    healthcheck:
      test: 
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  #Pgadmin    
  pgadmin-cloud:
    image: dpage/pgadmin4:6.17
    container_name: campuscloud-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres-cloud:
        condition: service_healthy
          
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - campuscloud-net
  #SQL
  sql-cloud:
    image: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04
    container_name: campuscloud-sql
    restart: always
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    networks:
      - campuscloud-net
  #MONGO
  mongo-cloud:
    image: mongo:latest
    container_name: campuscloud-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - campuscloud-net
  #NEO4J
  neo4j-cloud:
    image: neo4j:5-community
    container_name: campuscloud-neo4j
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "${NEO4J_HTTP_PORT}:7474"   # Panel web de Neo4j
      - "${NEO4J_BOLT_PORT}:7687"   # Protocolo de conexión (Bolt)
    volumes:
      - neo4j-data:/data
    networks:
      - campuscloud-net
  # CASSANDRA
  cassandra-cloud:
    image: cassandra:latest
    container_name: campuscloud-cassandra
    restart: always
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME}
      CASSANDRA_DC: ${CASSANDRA_DC}
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M    
    ports:
      - "${CASSANDRA_PORT}:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - campuscloud-net    

# VOLUMENES
volumes:
  postgres-data:
    external: true
    name: ${POSTGRES_VOLUME}

  pgadmin-data:
    external: true
    name: ${PGADMIN_VOLUME}

  sql-data:
    external: true
    name: ${SQLSERVER_VOLUME}

  mongo-data:
    external: true
    name: ${MONGO_VOLUME}
    
  neo4j-data:
    external: true
    name: ${NEO4J_VOLUME}  
    
  cassandra-data:
    external: true
    name: ${CASSANDRA_VOLUME}

#RED
networks:
  campuscloud-net:
    external: true
    name: ${DOCKER_NETWORK}


